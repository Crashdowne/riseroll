# CI runs on https://gitlab.ariverse.ca (GitLab CI/CD). Check results with `gitlab-ci wait`.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages: [test]

web:
  stage: test
  tags: [ubuntu-latest]
  timeout: 30m
  interruptible: true
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build

# Linux jobs run on the GitLab server runner, whose built-in default image is bare alpine.
default:
  image: catthehacker/ubuntu:act-latest
